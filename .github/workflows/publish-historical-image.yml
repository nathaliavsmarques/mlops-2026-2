name: Publicar imagem histórica no GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão histórica a reconstruir"
        required: true
        type: choice
        options:
          - v1.0.1
          - v1.0.2

permissions:
  contents: read

jobs:
  publish:
    name: Reconstruir e publicar imagem histórica
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validar tag permitida
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" != "v1.0.1" && "$TAG" != "v1.0.2" ]]; then
            echo "::error::Tag não permitida: $TAG"
            exit 1
          fi

      - name: Checkout do código da tag histórica
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Identificar commit histórico
        run: |
          echo "Tag selecionada: ${{ inputs.tag }}"
          echo "Commit reconstruído: $(git rev-parse HEAD)"
          echo "::notice::Imagem histórica reconstruída sem executar os testes que falharam nas execuções originais."

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem histórica
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
